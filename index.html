<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JUN TRAINING</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#171717;--muted:#737373;--line:#e5e5e7;--dark:#111;--soft:#efeff2;--good:#e8f7e8}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:720px;margin:auto;padding:14px 12px 126px} header{display:flex;justify-content:space-between;align-items:end;margin:4px 2px 14px}
h1{font-size:25px;margin:0}.small{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tab{border:0;border-radius:14px;padding:13px;background:var(--soft);font-weight:800;font-size:15px}.tab.active{background:var(--dark);color:#fff}
.summary{background:#111;color:#fff;border-radius:18px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.summary .title{font-size:20px;font-weight:900}.summary .small{color:#bbb}
.card{background:var(--card);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.head{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:start}.num{width:30px;height:30px;border-radius:9px;background:#111;color:white;display:grid;place-items:center;font-size:13px;font-weight:800}
.name{font-size:17px;font-weight:850;line-height:1.3}.meta{font-size:12px;color:var(--muted);margin-top:4px}.iconbtn{border:0;background:var(--soft);border-radius:10px;padding:8px 10px;font-weight:800}
.warmup,.prev{margin-top:10px;padding:9px 10px;background:#fafafa;border-radius:11px;border:1px solid var(--line);font-size:12px;line-height:1.5}.up{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--good);font-weight:900;font-size:11px}
.sets{display:grid;gap:7px;margin-top:11px}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 36px;gap:7px;align-items:center;border-radius:10px;border:2px solid transparent;padding:2px}.setrow.next-highlight{background:#fff6e0;border-color:#f0a020}.setlabel{font-size:11px;font-weight:800;color:var(--muted)}
input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 9px;background:#fff;font-size:15px;outline:none}textarea{min-height:120px;resize:vertical}
.done{height:35px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}.done.on{background:#111;color:#fff}
.actions{display:flex;gap:8px;margin-top:11px}.btn{border:0;border-radius:11px;padding:10px 12px;background:var(--soft);font-weight:800}.btn.dark{background:#111;color:#fff}
.timerbox{display:none;position:sticky;top:8px;z-index:10;background:#111;color:#fff;border-radius:16px;padding:11px 13px;margin-bottom:10px;justify-content:space-between;align-items:center}.timerbox.show{display:flex}.timer{font-size:27px;font-weight:900}.timerbox button{border:0;border-radius:9px;padding:8px 10px;font-weight:800}
.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(245,245,247,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.footerin{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px}.footer button{border:0;border-radius:13px;padding:12px 7px;font-weight:850;font-size:11px}.reset{background:#e8e8eb}.save{background:#111;color:#fff}.share{background:#dff6df}.history{background:#ece6ff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;padding:16px;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px 22px 16px 16px;padding:17px}
.sheet h2{margin:0 0 13px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{font-size:12px;color:var(--muted);display:block;margin:0 0 4px}.full{grid-column:1/-1}
.sheetactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sheetactions button{border:0;border-radius:12px;padding:12px;font-weight:850}.danger{background:#ffeaea}.primary{background:#111;color:#fff}.green{background:#dff6df}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:9px 2px}.add{width:100%;border:1px dashed #aaa;background:transparent;border-radius:14px;padding:13px;font-weight:850;margin:8px 0 2px}.histitem{border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.histtitle{display:flex;justify-content:space-between;font-weight:900}.histbody{font-size:13px;line-height:1.55;margin-top:6px;color:#333}
@media(max-width:480px){.wrap{padding-left:9px;padding-right:9px}.setrow{grid-template-columns:39px 1fr 1fr 34px;gap:5px}.footerin{grid-template-columns:1fr 1fr 1fr 1fr}}

.recommend{margin-top:9px;padding:10px 11px;border-radius:11px;background:#eef7ee;font-size:12px;line-height:1.5}
.chartbtn{background:#f1edff}
.linebtn{background:#dff6df}
.chartwrap{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}
.chartlegend{font-size:12px;color:var(--muted);margin:4px 0 10px}
.chartempty{padding:28px 8px;text-align:center;color:var(--muted);font-size:13px}
.charttabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.charttabs button{border:0;border-radius:11px;padding:10px;font-weight:800;background:var(--soft)}
.charttabs button.active{background:#111;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>JUN TRAINING</h1><div class="small">スマホ用トレーニングログ</div></div><div class="small" id="today"></div></header>
<div class="tabs"><button class="tab active" id="tabA" onclick="switchPlan('A')">A｜休日</button><button class="tab" id="tabB" onclick="switchPlan('B')">B｜平日</button></div>
<div id="timerBox" class="timerbox"><div><div class="small" style="color:#bbb">REST TIMER</div><div id="timerText" class="timer">03:00</div></div><button onclick="stopTimer()">停止</button></div>
<div class="summary"><div><div class="title" id="planTitle">A｜休日</div><div class="small" id="planInfo"></div></div><div style="text-align:right"><div class="title" id="progress">0 / 0</div><div class="small">完了セット</div></div></div>
<div id="list"></div>
<button class="add" onclick="newExercise()">＋ 種目を追加</button>
<button class="add" onclick="restoreDefaults()">↻ デフォルトメニューを復元</button>
<div class="note">種目・重量・回数・休憩は自由に変更できます。前回記録と履歴はこの端末に保存されます。</div>
</div>
<div class="footer"><div class="footerin"><button class="reset" onclick="resetLog()">リセット</button><button class="save" onclick="finishWorkout()">完了保存</button><button class="history" onclick="openHistory()">履歴</button><button class="share" onclick="openReport()">報告</button></div></div>

<div id="editModal" class="modal" onclick="outsideClose(event,'editModal')"><div class="sheet">
<h2 id="modalTitle">種目を編集</h2><div class="grid">
<div class="field full"><label>種目名</label><input id="fName"></div><div class="field"><label>セット数</label><input id="fSets" type="number" min="1" max="10"></div><div class="field"><label>休憩（分）</label><input id="fRest" type="number" min="0" step="0.5"></div><div class="field"><label>想定時間（分）</label><input id="fMinutes" type="number" min="0" step="1"></div>
<div class="field full"><label>回数の目安</label><input id="fTarget"></div><div class="field"><label>メイン重量（kg・任意）</label><input id="fKg" inputmode="decimal"></div><div class="field"><label>メモ（任意）</label><input id="fNote"></div><div class="field full"><label>アップ内容（任意）</label><input id="fWarmup"></div>
</div><div class="sheetactions"><button class="danger" id="deleteBtn" onclick="deleteExercise()">削除</button><button class="primary" onclick="saveExercise()">保存</button></div><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('editModal')">キャンセル</button></div></div>

<div id="reportModal" class="modal" onclick="outsideClose(event,'reportModal')"><div class="sheet">
<h2>トレーナーへ報告</h2><div class="field"><label>今日の体感・気づき</label><input id="condition" placeholder="例：ベンチは余裕あり。RDLはハムに入った"></div>
<div class="field"><label>トレーナーからのコメント</label><textarea id="trainerComment" placeholder="LINEでもらったコメントを貼って保存"></textarea></div>
<div class="field"><label>LINE用報告文</label><div class="small" style="margin-bottom:5px">回数を入力したセットだけ「重量×回数」で自動整形します</div><textarea id="reportText"></textarea></div>
<div class="sheetactions"><button class="green" onclick="copyReport()">報告文をコピー</button><button class="primary" onclick="sendLineReport()">LINEで報告</button></div>
<button class="btn" style="width:100%;margin-top:8px" onclick="saveTrainerComment()">コメント保存</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('reportModal')">閉じる</button></div></div>

<div id="historyModal" class="modal" onclick="outsideClose(event,'historyModal')"><div class="sheet"><h2>トレーニング履歴</h2><div id="historyList"></div><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('historyModal')">閉じる</button></div></div>


<div id="chartModal" class="modal" onclick="outsideClose(event,'chartModal')"><div class="sheet">
<h2 id="chartTitle">推移グラフ</h2>
<div class="charttabs">
<button id="chartKgBtn" class="active" onclick="setChartMode('kg')">重量</button>
<button id="chartRepsBtn" onclick="setChartMode('reps')">回数</button>
<button id="chart1rmBtn" onclick="setChartMode('1rm')">推定1RM</button>
</div>
<div class="chartlegend" id="chartLegend"></div>
<div class="chartwrap" id="chartBox"></div>
<button class="btn" style="width:100%;margin-top:10px" onclick="closeModal('chartModal')">閉じる</button>
</div></div>

<script>
const defaults={
A:{title:"A｜休日",minutes:86,ex:[
{name:"15° ベンチプレス",sets:4,target:"8〜10回",rest:3,minutes:22,kg:30,warmup:"20kg×10 → 25kg×5 → 27.5kg×2（休憩なし）→ 3分休憩",note:""},
{name:"バーベルショルダープレス",sets:2,target:"10〜12回",rest:3,minutes:8,kg:"",warmup:"",note:""},
{name:"サイドレイズ",sets:4,target:"15〜20回",rest:1,minutes:8,kg:"",warmup:"",note:""},
{name:"ルーマニアンデッドリフト",sets:3,target:"8〜10回",rest:3,minutes:16,kg:30,warmup:"15kg×10 → 3分休憩",note:""},
{name:"プルアップ",sets:3,target:"5〜8回",rest:3,minutes:12,kg:"",warmup:"",note:""},
{name:"サポートダンベルロウ",sets:2,target:"12〜15回",rest:3,minutes:8,kg:"",warmup:"",note:"胸をベンチで支えて引く"},
{name:"ワイドスクワット",sets:2,target:"10〜12回",rest:3,minutes:12,kg:30,warmup:"15kg×10 → 3分休憩",note:""}]},
B:{title:"B｜平日",minutes:60,ex:[
{name:"バープッシュアップ",sets:3,target:"限界回数",rest:3,minutes:12,kg:"",warmup:"",note:""},
{name:"ダンベルショルダープレス",sets:1,target:"12〜15回",rest:3,minutes:4,kg:"",warmup:"",note:""},
{name:"サイドレイズ",sets:2,target:"15〜20回",rest:1,minutes:4,kg:"",warmup:"",note:""},
{name:"ルーマニアンデッドリフト",sets:2,target:"8〜10回",rest:3,minutes:12,kg:30,warmup:"15kg×10 → 3分休憩",note:""},
{name:"プルアップ",sets:2,target:"5〜8回",rest:3,minutes:8,kg:"",warmup:"",note:""},
{name:"サポートダンベルロウ",sets:2,target:"12〜15回",rest:3,minutes:8,kg:"",warmup:"",note:"胸をベンチで支えて引く"},
{name:"ワイドスクワット",sets:2,target:"10〜12回",rest:3,minutes:12,kg:30,warmup:"15kg×10 → 3分休憩",note:""}]}};

let current="A", editing=null, timerId=null, remaining=0;
let highlightedSetKey=null, highlightedPlan=null;
function clone(x){return JSON.parse(JSON.stringify(x))}

function tokyoDateParts(){
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Tokyo",
    year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  const obj={};
  parts.forEach(p=>{ if(p.type!=="literal") obj[p.type]=p.value; });
  return {year:obj.year,month:obj.month,day:obj.day};
}
function tokyoISODate(){
  const d=tokyoDateParts();
  return `${d.year}-${d.month}-${d.day}`;
}
function tokyoMD(){
  const d=tokyoDateParts();
  return `${parseInt(d.month,10)}/${parseInt(d.day,10)}`;
}


function ensureMinutes(p){
  const minsA=[22,8,8,16,12,8,12];
  const minsB=[12,4,4,12,8,8,12];
  if(p?.A?.ex) p.A.ex.forEach((e,i)=>{if(e.minutes===undefined||e.minutes===null||e.minutes==="") e.minutes=minsA[i]||0;});
  if(p?.B?.ex) p.B.ex.forEach((e,i)=>{if(e.minutes===undefined||e.minutes===null||e.minutes==="") e.minutes=minsB[i]||0;});
  return p;
}

function getPlans(){try{const x=localStorage.getItem("jun_training_plans");if(!x)return ensureMinutes(clone(defaults));const p=JSON.parse(x);if(!p?.A?.ex?.length||!p?.B?.ex?.length){const d=clone(defaults);localStorage.setItem("jun_training_plans",JSON.stringify(d));return d}p=ensureMinutes(p);localStorage.setItem("jun_training_plans",JSON.stringify(p));return p}catch(e){return ensureMinutes(clone(defaults))}}
function putPlans(p){localStorage.setItem("jun_training_plans",JSON.stringify(p))}
function todayISO(){return tokyoISODate()}
function dkey(){return todayISO()+"_"+current}
function getLog(){try{return JSON.parse(localStorage.getItem("jun_training_log_"+dkey())||"{}")}catch(e){return{}}}
function putLog(x){localStorage.setItem("jun_training_log_"+dkey(),JSON.stringify(x))}
function getHistory(){try{return JSON.parse(localStorage.getItem("jun_training_history")||"[]")}catch(e){return[]}}
function putHistory(x){localStorage.setItem("jun_training_history",JSON.stringify(x))}
function fmtDate(iso=todayISO()){const d=new Date(iso+"T00:00:00");return `${d.getMonth()+1}/${d.getDate()}`}
document.getElementById("today").textContent=fmtDate();


let chartExerciseName="", chartMode="kg";
function parseTargetMax(target){
  const nums=(target||"").match(/\d+/g);
  return nums&&nums.length?Math.max(...nums.map(Number)):null;
}
function nextRecommendation(ex,ei,log){
  const sets=[];
  for(let si=0;si<ex.sets;si++){
    const x=log[`e${ei}s${si}`]||{};
    sets.push({kg:parseFloat(x.kg)||0,reps:parseInt(x.reps)||0});
  }
  if(!sets.some(x=>x.kg||x.reps)) return "今日の記録を入れると次回おすすめを表示します。";
  const usedKg=Math.max(...sets.map(x=>x.kg));
  const maxRep=parseTargetMax(ex.target);
  if(!usedKg) return "自重種目：まず全セットで目標回数を安定して達成。";
  const valid=sets.filter(x=>x.reps>0);
  if(!valid.length||!maxRep) return `次回目安：${usedKg}kgを基準に調整。`;
  const allHit=valid.length===ex.sets && valid.every(x=>x.reps>=maxRep);
  if(!allHit) return `次回：${usedKg}kg継続。全セットで${maxRep}回できたら増量。`;
  const todayOneRM=Math.max(0,...sets.map(x=>estimated1RM(x.kg,x.reps)));
  const prevInfo=latestAndPrevOneRM(ex.name);
  const prevOneRM=prevInfo?prevInfo.latest:null;
  const declining=(todayOneRM>0 && prevOneRM!=null && (prevOneRM-todayOneRM)>0.5);
  if(declining) return `次回：${usedKg}kg継続。推定1RMがやや低下しているため無理に増量しません。`;
  const step=usedKg<20?1:2.5;
  return `次回：${usedKg+step}kgへアップ候補`;
}
function estimated1RM(kg,reps){
  return (kg>0 && reps>0) ? kg*(1+reps/30) : 0;
}
function exerciseHistory(name){
  return getHistory().filter(s=>Array.isArray(s.exercises))
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(s=>{
      const e=s.exercises.find(e=>e.name===name);
      if(!e) return null;
      const vals=(e.sets||[]).map(x=>({kg:parseFloat(x.kg)||0,reps:parseInt(x.reps)||0}));
      const oneRM=Math.max(0,...vals.map(x=>estimated1RM(x.kg,x.reps)));
      return {date:s.date,kg:Math.max(0,...vals.map(x=>x.kg)),reps:Math.max(0,...vals.map(x=>x.reps)),oneRM};
    }).filter(Boolean);
}
function latestAndPrevOneRM(name){
  const hist=exerciseHistory(name).filter(d=>d.oneRM>0);
  if(!hist.length) return null;
  const latest=hist[hist.length-1];
  const prev=hist.length>1?hist[hist.length-2]:null;
  return {latest:latest.oneRM, prev:prev?prev.oneRM:null};
}
function oneRMSummaryText(ex){
  const r=latestAndPrevOneRM(ex.name);
  if(!r) return "";
  const latestText=r.latest.toFixed(1)+"kg";
  if(r.prev==null) return `推定1RM：${latestText}（Epley式）`;
  const diff=r.latest-r.prev;
  const diffText=(diff>=0?"+":"")+diff.toFixed(1)+"kg";
  return `推定1RM：${r.prev.toFixed(1)}kg → ${latestText}（${diffText}）`;
}
function chartValueOf(d){return chartMode==="kg"?d.kg:chartMode==="reps"?d.reps:d.oneRM}
function openExerciseChart(name){
  chartExerciseName=name; chartMode="kg"; chartTitle.textContent=name+"｜推移";
  chartKgBtn.classList.add("active"); chartRepsBtn.classList.remove("active"); chart1rmBtn.classList.remove("active");
  drawChart(); openModal("chartModal");
}
function setChartMode(mode){
  chartMode=mode;
  chartKgBtn.classList.toggle("active",mode==="kg");
  chartRepsBtn.classList.toggle("active",mode==="reps");
  chart1rmBtn.classList.toggle("active",mode==="1rm");
  drawChart();
}
function drawChart(){
  const rows=exerciseHistory(chartExerciseName).filter(d=>chartValueOf(d)>0);
  chartBox.innerHTML="";
  chartLegend.textContent=chartMode==="kg"?"各日の最高使用重量（kg）":chartMode==="reps"?"各日の最高回数":"各日の推定1RM（Epley式・kg）";
  if(!rows.length){chartBox.innerHTML='<div class="chartempty">履歴がたまるとここに推移グラフが出ます。</div>';return;}
  const w=620,h=260,L=45,R=18,T=18,B=48;
  const decimals=chartMode==="reps"?0:1;
  const vals=rows.map(chartValueOf);
  const lo=Math.max(0,Math.floor(Math.min(...vals)*0.9));
  const hi=Math.max(lo+1,Math.ceil(Math.max(...vals)*1.1));
  const x=i=>rows.length===1?L+(w-L-R)/2:L+i*(w-L-R)/(rows.length-1);
  const y=v=>T+(hi-v)*(h-T-B)/(hi-lo);
  const pts=rows.map((d,i)=>`${x(i)},${y(chartValueOf(d))}`).join(" ");
  const grid=[0,.25,.5,.75,1].map(t=>{
    const yy=T+t*(h-T-B), val=(hi-t*(hi-lo)).toFixed(decimals);
    return `<line x1="${L}" y1="${yy}" x2="${w-R}" y2="${yy}" stroke="#e7e7e7"/><text x="${L-7}" y="${yy+4}" text-anchor="end" font-size="11" fill="#777">${val}</text>`;
  }).join("");
  const labels=rows.map((d,i)=>`<text x="${x(i)}" y="${h-18}" text-anchor="middle" font-size="10" fill="#777">${d.date.slice(5).replace("-","/")}</text>`).join("");
  const dots=rows.map((d,i)=>{const v=chartValueOf(d),label=chartMode==="1rm"?v.toFixed(1):v;return `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#111"/><text x="${x(i)}" y="${y(v)-9}" text-anchor="middle" font-size="11" font-weight="700">${label}</text>`}).join("");
  chartBox.innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="#111" stroke-width="3" points="${pts}"/>${grid}${dots}${labels}</svg>`;
}


function roundTo2_5(v){
  return Math.max(0, Math.round(v/2.5)*2.5);
}
function getMainKg(ex,ei,log){
  const first=log[`e${ei}s0`]||{};
  const inputKg=parseFloat(first.kg);
  if(!isNaN(inputKg) && inputKg>0) return inputKg;
  const defaultKg=parseFloat(ex.kg);
  return (!isNaN(defaultKg) && defaultKg>0) ? defaultKg : 0;
}
function autoWarmupText(ex,ei,log){
  const main=getMainKg(ex,ei,log);
  if(!main) return ex.warmup||"";

  const name=ex.name||"";

  // 15°ベンチ：35kg → 20kg×10 → 25kg×5 → 30kg×2
  if(name.includes("15°") && name.includes("ベンチ")){
    let w1=roundTo2_5(main*0.60);
    let w2=roundTo2_5(main*0.70);
    let w3=roundTo2_5(main*0.85);

    if(w2<=w1) w2=w1+2.5;
    if(w3<=w2) w3=w2+2.5;
    if(w3>=main) w3=Math.max(0, main-2.5);

    return `${w1}kg×10 → ${w2}kg×5 → ${w3}kg×2（休憩なし）→ 3分休憩`;
  }

  // RDL / ワイドスクワット：メイン重量の半分 ×10
  if(name.includes("ルーマニアンデッドリフト") || name.includes("ワイドスクワット")){
    const w=roundTo2_5(main*0.5);
    return `${w}kg×10 → 3分休憩`;
  }

  return ex.warmup||"";
}
function refreshWarmupForExercise(ei){
  const p=getPlans()[current], log=getLog();
  const ex=p.ex[ei];
  const el=document.getElementById(`warmup-${ei}`);
  if(!ex || !el) return;
  const span=el.querySelector("span");
  if(span) span.textContent=autoWarmupText(ex,ei,log);
}

function previousSession(){const h=getHistory().filter(x=>x.plan===current).sort((a,b)=>b.date.localeCompare(a.date));return h[0]||null}
function findPrevExercise(name){const p=previousSession();return p?p.exercises.find(x=>x.name===name)||null:null}
function prevText(ex){const p=findPrevExercise(ex.name);if(!p)return "前回記録なし";return p.sets.map((x,i)=>`${i+1}:${x.kg?x.kg+"kg":"自重"}${x.reps?"×"+x.reps:""}`).join(" / ")}
function render(){const p=getPlans()[current],log=getLog();planTitle.textContent=p.title;const totalMinutes=p.ex.reduce((sum,e)=>sum+(parseInt(e.minutes)||0),0)||p.minutes;planInfo.textContent=`${p.ex.length}種目・約${totalMinutes}分`;list.innerHTML="";let total=0,done=0;
p.ex.forEach((ex,ei)=>{let rows="";for(let si=0;si<ex.sets;si++){total++;const k=`e${ei}s${si}`,x=log[k]||{};if(x.done)done++;const isNext=current===highlightedPlan && k===highlightedSetKey;rows+=`<div class="setrow${isNext?' next-highlight':''}" data-setrow="${k}"><div class="setlabel">SET ${si+1}</div><input inputmode="decimal" placeholder="kg" value="${x.kg??ex.kg??''}" data-key="${k}" data-field="kg"><input inputmode="numeric" placeholder="回数" value="${x.reps??''}" data-key="${k}" data-field="reps"><button class="done ${x.done?'on':''}" onclick="toggleDone('${k}')">${x.done?'✓':'○'}</button></div>`}
const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="head"><div class="num">${ei+1}</div><div class="name">${ex.name}<div class="meta">${ex.target} × ${ex.sets}set ｜ 休憩 ${ex.rest}分${ex.minutes?` ｜ 約${ex.minutes}分`:``}${ex.note?` ｜ ${ex.note}`:''}</div></div><button class="iconbtn" onclick="editExercise(${ei})">編集</button></div>${autoWarmupText(ex,ei,log)?`<div class="warmup" id="warmup-${ei}"><b>UP</b><br><span>${autoWarmupText(ex,ei,log)}</span></div>`:''}<div class="prev"><b>前回：</b>${prevText(ex)}</div><div class="sets">${rows}</div><div class="recommend"><b>NEXT</b><br>${nextRecommendation(ex,ei,log)}${oneRMSummaryText(ex)?`<br>${oneRMSummaryText(ex)}`:''}</div><div class="actions"><button class="btn dark" onclick="startTimer(${Math.round(ex.rest*60)})">休憩 ${ex.rest}分スタート</button><button class="btn chartbtn" onclick="openExerciseChart('${ex.name.replace(/'/g,"\\'")}')">推移を見る</button></div>`;list.appendChild(c)});
progress.textContent=`${done} / ${total}`;document.querySelectorAll("input[data-key]").forEach(el=>el.addEventListener("change",saveLog))}
function saveLog(){const log=getLog();document.querySelectorAll("input[data-key]").forEach(el=>{const k=el.dataset.key,f=el.dataset.field;log[k]=log[k]||{};log[k][f]=el.value});putLog(log)}
function toggleDone(k){saveLog();const l=getLog();l[k]=l[k]||{};l[k].done=!l[k].done;putLog(l);if(k===highlightedSetKey && current===highlightedPlan) clearNextHighlight();render();if(l[k].done){const m=(k||"").match(/^e(\d+)s(\d+)$/);if(m){const ei=parseInt(m[1],10),si=parseInt(m[2],10);const ex=getPlans()[current].ex[ei];if(ex && si<ex.sets-1) startTimer(Math.round(ex.rest*60),`e${ei}s${si+1}`,current)}}}
function resetLog(){if(confirm("今日の記録をリセットしますか？")){localStorage.removeItem("jun_training_log_"+dkey());if(current===highlightedPlan) clearNextHighlight();render()}}
function switchPlan(p){saveLog();current=p;tabA.classList.toggle("active",p==="A");tabB.classList.toggle("active",p==="B");render()}
function editExercise(i){editing=i;const ex=getPlans()[current].ex[i];modalTitle.textContent="種目を編集";fName.value=ex.name;fSets.value=ex.sets;fRest.value=ex.rest;fMinutes.value=ex.minutes??"";fTarget.value=ex.target;fKg.value=ex.kg??"";fNote.value=ex.note??"";fWarmup.value=ex.warmup??"";deleteBtn.style.visibility="visible";openModal("editModal")}
function newExercise(){editing=-1;modalTitle.textContent="種目を追加";["fName","fTarget","fKg","fNote","fWarmup"].forEach(id=>document.getElementById(id).value="");fSets.value=3;fRest.value=2;fMinutes.value="";deleteBtn.style.visibility="hidden";openModal("editModal")}
function saveExercise(){const ex={name:fName.value.trim()||"新しい種目",sets:Math.max(1,parseInt(fSets.value||1)),rest:Math.max(0,parseFloat(fRest.value||0)),minutes:Math.max(0,parseInt(fMinutes.value||0)),target:fTarget.value.trim()||"回数自由",kg:fKg.value,note:fNote.value.trim(),warmup:fWarmup.value.trim()};const p=getPlans();if(editing===-1)p[current].ex.push(ex);else p[current].ex[editing]=ex;putPlans(p);closeModal("editModal");render()}
function deleteExercise(){if(editing<0)return;if(confirm("この種目を削除しますか？")){const p=getPlans();p[current].ex.splice(editing,1);putPlans(p);closeModal("editModal");render()}}
function restoreDefaults(){if(confirm("A・Bメニューをデフォルトに戻しますか？")){putPlans(clone(defaults));render()}}
function openModal(id){document.getElementById(id).classList.add("show")}function closeModal(id){document.getElementById(id).classList.remove("show")}function outsideClose(e,id){if(e.target.id===id)closeModal(id)}
let audioCtx=null;
function unlockAudioCtx(ctx){
  // 無音バッファを即再生し、Android Chrome/PWAでの自動再生ロックを
  // ユーザー操作のタイミングで確実に解除しておく
  try{
    const buf=ctx.createBuffer(1,1,22050);
    const src=ctx.createBufferSource();
    src.buffer=buf;src.connect(ctx.destination);
    if(src.start) src.start(0); else if(src.noteOn) src.noteOn(0);
  }catch(e){}
}
function ensureAudioCtx(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    if(!audioCtx) audioCtx=new Ctx();
    if(audioCtx.state==="suspended") audioCtx.resume();
    unlockAudioCtx(audioCtx);
    return audioCtx;
  }catch(e){return null}
}
if("addEventListener" in document){
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible" && audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  });
}
function playTimerEndBeep(){
  try{
    const ctx=ensureAudioCtx();
    if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type="sine";osc.frequency.value=880;
    gain.gain.setValueAtTime(0.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.35);
    osc.connect(gain).connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+0.36);
  }catch(e){}
}
function vibrateTimerEnd(){
  try{if(navigator.vibrate) navigator.vibrate([200,100,200])}catch(e){}
}
function notifyTimerEnd(){playTimerEndBeep();vibrateTimerEnd()}
function clearNextHighlight(liveDomOnly){
  if(!highlightedSetKey) return;
  const key=highlightedSetKey,plan=highlightedPlan;
  highlightedSetKey=null;highlightedPlan=null;
  if(liveDomOnly && plan===current){
    const row=document.querySelector(`.setrow[data-setrow="${key}"]`);
    if(row) row.classList.remove("next-highlight");
  }
}
function highlightNextSet(key,plan){
  highlightedSetKey=key;highlightedPlan=plan;
  render();
  if(plan===current){
    const row=document.querySelector(`.setrow[data-setrow="${key}"]`);
    if(row) row.scrollIntoView({behavior:"smooth",block:"center"});
  }
}
function startTimer(sec,nextKey,nextPlan){stopTimer(false);remaining=sec;timerBox.classList.add("show");ensureAudioCtx();tick();timerId=setInterval(()=>{remaining--;tick();if(remaining<=0){
  stopTimer();
  // 音・バイブのOSへのディスパッチを最優先で確実に行うため、
  // 重い次セット強調のrender()とブロッキングなalert()は
  // 一度メインスレッドを解放してから実行する（setTimeoutで遅延）。
  // こうしないと、render()の同期処理とalert()のブロッキングにより
  // 実機（Android Chrome）で音・バイブのリクエストが握りつぶされることがある。
  notifyTimerEnd();
  setTimeout(()=>{
    try{ if(nextKey) highlightNextSet(nextKey,nextPlan); }catch(e){}
    alert("休憩終了！");
  },0);
}},1000)}
function tick(){timerText.textContent=`${String(Math.floor(remaining/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`}function stopTimer(hide=true){if(timerId)clearInterval(timerId);timerId=null;if(hide)timerBox.classList.remove("show")}
function buildSession(){saveLog();const p=getPlans()[current],log=getLog();return{date:todayISO(),plan:current,title:p.title,exercises:p.ex.map((ex,ei)=>({name:ex.name,sets:Array.from({length:ex.sets},(_,si)=>log[`e${ei}s${si}`]||{})})),condition:"",trainerComment:""}}
function finishWorkout(){const s=buildSession(),h=getHistory(),idx=h.findIndex(x=>x.date===s.date&&x.plan===s.plan);if(idx>=0){s.condition=h[idx].condition||"";s.trainerComment=h[idx].trainerComment||"";h[idx]=s}else h.push(s);putHistory(h);alert("今日のトレーニングを保存しました");render()}
function getTodayHistory(){return getHistory().find(x=>x.date===todayISO()&&x.plan===current)||null}
function makeReport(){
  saveLog();
  const p=getPlans()[current], log=getLog();
  let out=`【${fmtDate()} ${p.title} トレーニング報告】
`;

  let recordedCount=0;
  p.ex.forEach((ex,ei)=>{
    const sets=[];
    for(let si=0;si<ex.sets;si++){
      const x=log[`e${ei}s${si}`]||{};
      const kg=(x.kg!==undefined && x.kg!=="") ? String(x.kg).trim() : "";
      const reps=(x.reps!==undefined && x.reps!=="") ? String(x.reps).trim() : "";

      // 回数入力があるセットのみ報告対象。
      // 自重種目はkgが空でも「自重×○回」と表示。
      if(reps){
        sets.push(`${kg ? kg+"kg" : "自重"}×${reps}回`);
      }
    }

    if(sets.length){
      recordedCount++;
      out+=`
${recordedCount}. ${ex.name}
${sets.join(" / ")}
`;
    }
  });

  if(!recordedCount){
    out+=`
※まだ回数の入力がありません。
`;
  }

  const c=condition.value.trim();
  if(c){
    out+=`
【今日の体感・気づき】
${c}
`;
  }

  out+=`
よろしくお願いします。`;
  return out;
}
function openReport(){const th=getTodayHistory();condition.value=th?.condition||"";trainerComment.value=th?.trainerComment||"";reportText.value=makeReport();condition.oninput=()=>reportText.value=makeReport();openModal("reportModal")}
async function copyReport(){try{await navigator.clipboard.writeText(reportText.value);alert("コピーしました")}catch(e){reportText.select();document.execCommand("copy");alert("コピーしました")}}

function sendLineReport(){
  const text=reportText.value||makeReport();
  window.location.href="https://line.me/R/share?text="+encodeURIComponent(text);
}
async function shareReport(){if(navigator.share){try{await navigator.share({title:"トレーニング報告",text:reportText.value})}catch(e){}}else await copyReport()}
function saveTrainerComment(){const s=buildSession(),h=getHistory();s.condition=condition.value.trim();s.trainerComment=trainerComment.value.trim();const idx=h.findIndex(x=>x.date===s.date&&x.plan===s.plan);if(idx>=0)h[idx]=s;else h.push(s);putHistory(h);alert("保存しました")}
function openHistory(){const h=getHistory().sort((a,b)=>b.date.localeCompare(a.date));historyList.innerHTML="";if(!h.length)historyList.innerHTML='<div class="note">まだ履歴がありません。</div>';h.forEach(s=>{const d=document.createElement("div");d.className="histitem";const body=s.exercises.map(e=>{const v=(e.sets||[]).filter(x=>x.kg||x.reps).map(x=>`${x.kg?x.kg+"kg":"自重"}${x.reps?"×"+x.reps:""}`).join(" / ");return v?`<div><b>${e.name}</b>：${v}</div>`:""}).join("");d.innerHTML=`<div class="histtitle"><span>${fmtDate(s.date)} ${s.title}</span></div><div class="histbody">${body||"記録なし"}${s.condition?`<div><b>体感：</b>${s.condition}</div>`:""}${s.trainerComment?`<div><b>トレーナー：</b>${s.trainerComment}</div>`:""}</div>`;historyList.appendChild(d)});openModal("historyModal")}
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  let swReloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(swReloaded || !hadController) return;
    swReloaded=true;
    window.location.reload();
  });
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
}

if(!window.__junWarmupAutoListener){
  window.__junWarmupAutoListener=true;
  const updateWarmupFromInput=(el)=>{
    if(!(el instanceof HTMLInputElement) || !el.matches('input[data-key]')) return;
    saveLog();
    if(el.dataset.field!=="kg") return;
    const m=(el.dataset.key||"").match(/^e(\d+)s0$/);
    if(m) refreshWarmupForExercise(parseInt(m[1],10));
  };
  // 強調解除は"input"イベント（実際のキー入力）のみで行う。
  // "change"はrender()がフォーカス中の要素を破棄した際にも
  // ブラウザがブラー扱いで同期発火することがあり、render()実行中に
  // highlightedSetKeyを書き換えてしまう再入バグを避けるため。
  document.addEventListener("input",e=>{
    const el=e.target;
    updateWarmupFromInput(el);
    if(el instanceof HTMLInputElement && el.matches('input[data-key]') && el.dataset.key===highlightedSetKey && current===highlightedPlan){
      clearNextHighlight(true);
    }
  });
  document.addEventListener("change",e=>updateWarmupFromInput(e.target));
}

render();
</script>
</body>
